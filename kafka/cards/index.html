<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a101d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Kafka Grand Master Deck · 카프카 120 대작 백과</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="brand">
          <strong>☕ KAFKA GRAND MASTER DECK</strong>
          <span>카프카 120 대작 백과 (공식 문서 링크 포함)</span>
        </div>
        <div class="progress-pill" id="progress">1 / 120</div>
      </header>

      <!-- Viewer Section -->
      <section class="view active" id="view-viewer">
        <div class="viewer">
          <div class="card-stage" id="card-stage">
            <div class="card" id="card" data-rarity="N">
              <div class="card-face front" id="face-front"></div>
              <div class="card-face back" id="face-back"></div>
            </div>
          </div>
          <div class="viewer-controls">
            <button type="button" class="nav-btn" id="btn-prev" aria-label="이전 카드">◀</button>
            <button type="button" class="random-btn" id="btn-random">
              <span class="dice">🎲</span> RANDOM
            </button>
            <button type="button" class="nav-btn" id="btn-next" aria-label="다음 카드">▶</button>
          </div>
        </div>
      </section>

      <!-- Dex Section (도감) -->
      <section class="view" id="view-dex">
        <div class="dex-header">
          <h2>도감</h2>
          <div class="rate" id="collect-rate"><b>0</b>/120 (0%)</div>
        </div>
        <div class="filters">
          <button type="button" class="filter-chip active" data-filter="ALL">전체</button>
          <button type="button" class="filter-chip" data-filter="INTRO">입문</button>
          <button type="button" class="filter-chip" data-filter="CORE">클라이언트</button>
          <button type="button" class="filter-chip" data-filter="ARCH">내부엔진</button>
          <button type="button" class="filter-chip" data-filter="EOS">트랜잭션</button>
          <button type="button" class="filter-chip" data-filter="STREAMS">스트림&커넥트</button>
          <button type="button" class="filter-chip" data-filter="ADVANCED">아키텍처패턴</button>
          <button type="button" class="filter-chip" data-filter="OPERATIONS">운영&Kubernetes</button>
          <button type="button" class="filter-chip" data-filter="OWNED">수집</button>
        </div>
        <div class="dex-grid" id="dex-grid"></div>
      </section>

      <!-- Path Section (학습 순서) -->
      <section class="view" id="view-path">
        <div class="dex-header">
          <h2>학습 로드맵</h2>
          <div class="rate">그랜드 마스터 코스 · 120개 전문 주제</div>
        </div>
        <div class="path-scroll" id="path-scroll"></div>
      </section>

      <!-- Bottom Tab Bar -->
      <nav class="bottom-nav">
        <button type="button" class="tab-btn active" data-view="viewer">
          <span class="ico">🃏</span>
          카드
        </button>
        <button type="button" class="tab-btn" data-view="dex">
          <span class="ico">📖</span>
          도감
        </button>
        <button type="button" class="tab-btn" data-view="path">
          <span class="ico">🗺️</span>
          패스
        </button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="js/cards.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
