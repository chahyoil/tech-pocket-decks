<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#100b0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Redis 공식 문서 기반 모바일 학습 카드 120장" />
    <title>Redis Card Deck · 학습 카드</title>
    <link rel="stylesheet" href="css/style.css?v=20260812-1" />
    <link rel="stylesheet" href="../../shared/deck-standard.css?v=20260812-1" />
  </head>
  <body data-deck="redis" data-deck-family="tcg">
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <strong>🧱 REDIS CARD DECK</strong>
          <span>공식 문서 기반 · 전 120장</span>
        </div>
        <div class="progress-pill" id="progress">1 / 120</div>
      </header>

      <!-- Viewer -->
      <section class="view active" id="view-viewer">
        <div class="viewer">
          <div class="card-stage" id="card-stage">
            <div class="card" id="card" data-rarity="N" tabindex="0" aria-label="카드를 눌러 뒤집기">
              <div class="card-face front" id="face-front"></div>
              <div class="card-face back" id="face-back"></div>
            </div>
          </div>
          <div class="viewer-controls">
            <button type="button" class="nav-btn" id="btn-prev" aria-label="이전">◀</button>
            <button type="button" class="random-btn" id="btn-random">
              <span class="dice">🎲</span> RANDOM
            </button>
            <button type="button" class="nav-btn" id="btn-next" aria-label="다음">▶</button>
          </div>
        </div>
      </section>

      <!-- Dex -->
      <section class="view" id="view-dex">
        <div class="dex-header">
          <h2>카드 목록</h2>
          <div class="rate" id="collect-rate"><b>0</b>/120 (0%)</div>
        </div>
        <div class="filters">
          <button type="button" class="filter-chip active" data-filter="ALL">전체</button>
          <button type="button" class="filter-chip" data-filter="STARTER">STARTER</button>
          <button type="button" class="filter-chip" data-filter="TYPE">TYPE</button>
          <button type="button" class="filter-chip" data-filter="ARCH">ARCH</button>
          <button type="button" class="filter-chip" data-filter="INTERNAL">INTERNAL</button>
          <button type="button" class="filter-chip" data-filter="OPS">OPS</button>
          <button type="button" class="filter-chip" data-filter="PROG">PROG</button>
          <button type="button" class="filter-chip" data-filter="PATTERN">PATTERN</button>
          <button type="button" class="filter-chip" data-filter="UR">UR+</button>
          <button type="button" class="filter-chip" data-filter="OWNED">수집</button>
          <button type="button" class="filter-chip" data-filter="LOCKED">미수집</button>
        </div>
        <div class="dex-grid" id="dex-grid"></div>
      </section>

      <!-- Path -->
      <section class="view" id="view-path">
        <div class="dex-header">
          <h2>학습 순서</h2>
          <div class="rate">자료구조 → 아키텍처 → 운영</div>
        </div>
        <div class="path-scroll" id="path-scroll"></div>
      </section>

      <nav class="bottom-nav">
        <button type="button" class="tab-btn active" data-view="viewer">
          <span class="ico">🃏</span>
          카드
        </button>
        <button type="button" class="tab-btn" data-view="dex">
          <span class="ico">📖</span>
          목록
        </button>
        <button type="button" class="tab-btn" data-view="path">
          <span class="ico">🗺️</span>
          순서
        </button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="js/visuals.js?v=20260812-1"></script>
    <script src="js/cards.js?v=20260812-1"></script>
    <script src="../../shared/deck-standard.js?v=20260812-1"></script>
    <script src="js/app.js?v=20260812-1"></script>
  </body>
</html>
